定）；H5下载清晰度图示空间50GB。权限修改对新任务生效，下载至到期可离线播放；删除单集则不可播。APP/H5一致约束保留，未验证浏览器实现。"}, {"topic": "视频上架与集序", "source": "S06 index045-051 AD04a-g", "detail": "选中的清晰度转码成功才可上架，失败可重试/取消该清晰度；列表AD04b有转码中但上架中示例需核对。单集重复集序为插入并后移，批量上传为冲突不提交或覆盖原集；资源继承、权限修改、已购买及下载内容影响要统一。"}, {"topic": "订单异常", "source": "S06 index052-055 AD12", "detail": "UI明确15分钟未支付关闭、已关闭不可补单，支付成功未到账且无重复记录/90天内可补；原PRD的关闭后回调走补单用例仍冲突。未在此处提供渠道回调和对账实现。"}, {"topic": "会员权益版本", "source": "S06 index061 AD11b、063 AD11d", "detail": "权益变更只对新购买用户生效，已购保持至到期；同时停用权益会从各档位展示隐藏。不同档位续费、展示与实际权益快照如何关联需明确。"}, {"topic": "打榜与结算", "source": "S06 index019-024 AD13", "detail": "题材先审后发、每期示例3条、单次10~5000金币、同分先达到者优先、结算锁定/冠军无奖励/金币不退；运营可隐藏冠军并记录内容立项状态。题材下架/删除也不退金币；“置顶”与真实排名关系需统一。"}, {"topic": "频道分类内容来源", "source": "S06 index064-073 AD02", "detail": "首页一级频道无内容池，下挂二级标签；工厂玩法卡例外。ACG一级可带二级或仅列表（漫画小说）；视频所属分类从ACG二级选。仅列表内容如何维护、首页AI卡配置落点、类别间映射仍需跟需求核对。"}, {"topic": "指标与演示数据", "source": "S06 AD01、AD12c、AD13c、AD14d", "detail": "保留源规则口径：金币消耗图仅打榜/私信/抽奖；补单按完成时间计入；下载失败率排除权限拦截但失败原因图含拦截。部分总数、冠军分数、占比、时间示例不相互吻合，不将演示数据当真实业务数据或最终验收值。"}, {"topic": "额外入口及状态覆盖", "source": "S05 C02、C06、G01b、H03、M02b、ST1、DL8", "detail": "UI有关注话题、用户动态、结果视频/用户标签、筛选入口；支付结果只展示成功、整页状态主要展示网络异常，其他状态多用注释描述。须后续核对范围及是否补充视觉状态，不能以静态一张图判断其他状态已实现。"}, {"topic": "后台横向滚动列", "source": "S06多张表格", "detail": "预览图中的横向滚动表格右侧内容被容器裁切；这是原PNG可见范围限制，放大也不能读到未导出部分。已读可见内容，不声称所有隐藏字段已读。"}], "build": "2026-10-26", "scope": "APP/H5 共用；后台独立交互；Web 原型待补；无跨端数据联动"};

function amountError(value,min=1,max=Infinity){const n=Number(value);return !Number.isFinite(n)||!Number.isInteger(n)||n<min||n>max;}
function validate(fields,values,context={}){const errors={};for(const f of fields){const v=values[f.key];if(f.required&&(v==null||String(v).trim()===''||(f.type==='checkbox'&&!v))){errors[f.key]='请填写'+f.label;continue;}if(v==null||v==='')continue;if(f.maxLength&&[...String(v)].length>f.maxLength)errors[f.key]=f.label+'最多 '+f.maxLength+' 字';if(f.type==='number'&&(!Number.isFinite(Number(v))||(f.integer!==false&&!Number.isInteger(Number(v)))||(f.min!=null&&Number(v)<f.min)||(f.max!=null&&Number(v)>f.max)))errors[f.key]=f.label+'需为'+(f.min!=null?f.min:'有效数值')+(f.max!=null?'～'+f.max:' 以上')+(f.integer===false?'的数值':'的整数');if(f.type==='tel'&&!/^1[3-9]\d{9}$/.test(String(v)))errors[f.key]='请输入正确的手机号';if(f.pattern&&!new RegExp(f.pattern).test(v))errors[f.key]=f.message||f.label+'格式不正确';}
 if(values.start&&values.end&&new Date(values.end)<=new Date(values.start))errors.end='结束时间须晚于开始时间';
 if(values.minAmount!==undefined&&values.maxAmount!==undefined&&Number(values.maxAmount)<Number(values.minAmount))errors.maxAmount='最高金额不能小于最低金额';
 if(values.bonus!==undefined&&Number(values.bonus)>Number(values.coins))errors.bonus='赠送数量不能超过到账金币数的 100%';
 if(values.vipLimit!==undefined&&Number(values.vipLimit)<=Number(values.normalLimit))errors.vipLimit='VIP 上限须大于普通用户上限';
 if(context.sumKeys){const sum=context.sumKeys.reduce((n,k)=>n+Number(values[k]||0),0);if(Math.abs(sum-100)>.00001)errors[context.sumKeys[0]]='合计为 '+sum+'%，须等于 100%';}
 if(values.kind==='实物'&&(!Number.isInteger(Number(values.stock))||Number(values.stock)<1))errors.stock='实物奖品必须填写正整数库存数量';
 if(values.parent==='未选择')errors.parent='请选择上级节点';
 if(values.poolMode&&values.poolMode==='手动'&&values.poolCount!==undefined&&Number(values.poolCount)<1&&context.publish)errors.poolCount='内容池为空，不能上架';
 if(values.transcode==='失败'&&context.publish)errors.transcode='选中清晰度转码失败，请重试或取消勾选';
 if(values.episode===6&&context.episodeConflict&&values.conflict!=='覆盖')errors.episode='第 6 集已存在，请修改集序或选择覆盖';
 if(context.repair&&(!values.channelPaid||values.fulfilled))errors.channelPaid='仅允许渠道支付成功且尚未到账的订单补单';
 if(context.repair&&values.closed&&!values.lateCallback)errors.lateCallback='关闭订单须存在已核实的迟到支付回调';
 return errors;
}
function spend(s,amount,kind){if(!s.logged)return {error:'login'};if(amountError(amount))return {error:'invalid'};if(s.coins<amount)return {error:'insufficient'};s.coins-=amount;return {ok:true,amount,kind};}
function claim(s,id){const t=tasks.find(x=>x.id===id);if(!s.logged)return {error:'login'};if(!t)return {error:'missing'};if(s.claims.includes(id))return {error:'duplicate'};if((s.taskProgress[id]||0)<t.goal)return {error:'incomplete'};s.claims.push(id);if(t.rewardType==='VIP')s.vipDays+=t.reward;else s.coins+=t.reward;return {ok:true,reward:t.reward,rewardType:t.rewardType||'金币'};}
function createOrder(s,type,index,now=Date.now()){const pack=(type==='vip'?vipPackages:packages)[index]||(type==='vip'?vipPackages:packages)[1];const o={id:'JF'+now+'-'+s.orders.length,type,pack:clone(pack),status:'待支付',created:now,expires:now+900000,credited:false,channelPaid:false};s.orders.unshift(o);return o;}
function settleOrder(s,id,result='success',now=Date.now()){const o=s.orders.find(x=>x.id===id);if(!o)return {error:'missing'};if(o.credited)return {error:'duplicate'};if(result==='pending'){o.status='确认中';return {pending:true};}if(result==='failure'){o.status='支付失败';return {error:'payment'};}o.channelPaid=true;if(now>o.expires||o.status==='已关闭'){o.status='异常待补单';return {anomaly:true};}o.status='已到账';o.credited=true;if(o.type==='vip')s.vipDays+=o.pack.days;else s.coins+=o.pack.coins+o.pack.bonus;return {ok:true,order:o};}
function repairOrder(s,id,verified,reason){const o=s.orders.find(x=>x.id===id);if(!o||!verified||!o.channelPaid||o.credited||!String(reason).trim())return {error:'notEligible'};o.status='补单已到账';o.credited=true;o.reason=reason;if(o.type==='vip')s.vipDays+=o.pack.days;else s.coins+=o.pack.coins+o.pack.bonus;return {ok:true};}
function contribute(s,amount){if(s.ranking.settled)return {error:'settled'};if(amountError(amount,10,5000))return {error:'range'};const r=spend(s,Number(amount),'打榜');if(r.ok){s.ranking.total+=Number(amount);s.ranking.my+=Number(amount);}return r;}
function grantTaskProgress(s,type,amount=1,key){if(key){s.countedVideos=s.countedVideos||{};s.countedVideos[type]=s.countedVideos[type]||[];if(s.countedVideos[type].includes(key))return s.taskProgress[type]||0;s.countedVideos[type].push(key);}s.taskProgress[type]=(s.taskProgress[type]||0)+amount;return s.taskProgress[type];}
function recordWatchProgress(s,videoId,validSeconds,duration){if(!videoId||!Number.isFinite(validSeconds)||!Number.isFinite(duration)||duration<=0||validSeconds<0)return {error:'invalid'};if(validSeconds>=30)grantTaskProgress(s,'view',1,videoId);if(validSeconds/duration>=.9)grantTaskProgress(s,'complete',1,videoId);return {ok:true,complete:validSeconds/duration>=.9};}
function approvePost(s,id){const p=s.posts.find(x=>x.id===id);if(!p)return {error:'missing'};if(p.status==='已发布')return {error:'duplicate'};p.status='已发布';if(!p.counted){grantTaskProgress(s,'post');p.counted=true;}s.notifications.unshift({text:'帖子审核通过，任务进度已更新，请前往签到福利领取。',page:'M04'});return {ok:true};}
function unlock(s,type,id='episode5'){if(type==='VIP'&&s.vipDays<=0)return {error:'vip'};if(type==='VIP'||type==='免费'||s.unlocked.includes(id))return {ok:true,free:true};const r=spend(s,20,'解锁');if(r.ok)s.unlocked.push(id);return r;}
function dmBuy(s,card){if(s.dm.paid&&!s.dm.expires)return {error:'duplicate'};const c=cards[card];const r=spend(s,c.coins,'私信');if(r.ok){s.dm.paid=true;s.dm.card=card;s.dm.expires=false;s.dm.invited=Date.now();}return r;}
function dmSend(s,text,type='文字'){if(s.dm.blocked)return {error:'blocked'};if(s.dm.expires)return {error:'expired'};if(!s.dm.paid||!s.dm.other)return {error:'waiting'};if(!cards[s.dm.card].media.includes(type))return {error:'media'};if(!String(text).trim())return {error:'empty'};s.dm.messages.push({text,type,time:Date.now()});return {ok:true};}
function refundInvite(s){if(!s.dm.paid||s.dm.other)return {error:'notEligible'};s.coins+=cards[s.dm.card].coins;s.dm.paid=false;s.dm.expires=false;return {ok:true};}
